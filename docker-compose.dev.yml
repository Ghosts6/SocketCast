version: "3.9"

# Local development overrides — bind mounts for hot reload, debug ports exposed
services:
  engine:
    build:
      context: ./engine
      target: builder
    volumes:
      - ./engine:/src
    command: bash -c "cmake -B build -G Ninja -DSOCKETCAST_BUILD_TESTS=ON && cmake --build build && ./build/socketcast_engine listen --bind 0.0.0.0 --port 5000"
    ports:
      - "5000:5000/udp"
      - "5001:5001/tcp"
      - "9100:9100"

  control-plane:
    volumes:
      - ./control-plane/app:/app/app
    environment:
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    volumes:
      - ./dashboard/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

  redis:
    ports:
      - "6379:6379"
