apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: socketcast
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: control-plane
        metrics_path: /metrics
        static_configs:
          - targets: ['control-plane:8000']

      - job_name: engine
        metrics_path: /admin/metrics
        static_configs:
          - targets: ['engine:5001']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: socketcast
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: socketcast
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
