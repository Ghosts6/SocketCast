apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: socketcast
spec:
  replicas: 1
  selector:
    matchLabels: { app: engine }
  template:
    metadata:
      labels: { app: engine }
    spec:
      containers:
        - name: engine
          image: socketcast/engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: UDP
            - containerPort: 5001
              protocol: TCP  # admin HTTP API — control-plane depends on this
            - containerPort: 9100
              protocol: TCP  # engine metrics (not yet exposed by the engine)
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /admin/health, port: 5001 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /admin/health, port: 5001 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ClusterIP only — admin has no auth, so it must stay off the NodePort
# service below rather than riding along with the externally reachable one.
apiVersion: v1
kind: Service
metadata:
  name: engine
  namespace: socketcast
spec:
  selector: { app: engine }
  ports:
    - name: admin
      port: 5001
      protocol: TCP
      targetPort: 5001
    - name: metrics
      port: 9100
      protocol: TCP
      targetPort: 9100
  type: ClusterIP
---
# NodePort for bare-metal/self-hosted deployment: a native client can reach
# UDP media at <any-node-ip>:30500 without depending on ingress/CNI LB support.
apiVersion: v1
kind: Service
metadata:
  name: engine-media
  namespace: socketcast
spec:
  selector: { app: engine }
  ports:
    - name: media
      port: 5000
      protocol: UDP
      targetPort: 5000
      nodePort: 30500
  type: NodePort
