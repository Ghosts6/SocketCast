name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S engine -B engine/build -G Ninja -DSOCKETCAST_BUILD_TESTS=ON
      - name: Build
        run: cmake --build engine/build
      - name: Test
        run: ctest --test-dir engine/build --output-on-failure

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing
        # Redis is mocked in tests/conftest.py — no Redis service required.

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: cd dashboard && npm install
      - name: Build
        run: cd dashboard && npm run build
